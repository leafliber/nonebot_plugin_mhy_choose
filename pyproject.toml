[project]
name = "nonebot-plugin-mhy-choose"
version = "0.1.0"
description = "A NoneBot2 plugin for sending random images from a specified folder"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "leafliber"}
]
keywords = ["nonebot", "nonebot2", "plugin", "image", "random"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]
dependencies = [
    "nonebot2>=2.0.0",
    "nonebot-adapter-onebot>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/leafliber/nonebot_plugin_mhy_choose"
Repository = "https://github.com/leafliber/nonebot_plugin_mhy_choose"

[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["nonebot_plugin_mhy_choose*"]

[tool.setuptools.package-data]
nonebot_plugin_mhy_choose = ["py.typed"]
